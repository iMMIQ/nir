[package]
name = "player-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "player_native"
path = "src/lib.rs"

[[bin]]
name = "player-native"
path = "src/main.rs"

[dependencies]
nir-ir.workspace = true
nir-vm.workspace = true
nir-ui.workspace = true
nir-render.workspace = true
nir-runtime.workspace = true
anyhow.workspace = true
base64.workspace = true
memmap2.workspace = true
pollster.workspace = true
rodio.workspace = true
serde.workspace = true
serde_json.workspace = true
symphonia.workspace = true
ogg.workspace = true
opus-static-sys.workspace = true
winit.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = { workspace = true, features = ["xdg-portal", "async-std"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-game-activity"] }
android-activity.workspace = true
jni = "0.21"
