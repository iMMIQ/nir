[package]
name = "player-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nir-engine.workspace = true
anyhow.workspace = true
nir-content.workspace = true
nir-format.workspace = true
serde_json.workspace = true
nir-player.workspace = true
nir-presentation.workspace = true
nir-render-wgpu.workspace = true

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
winit.workspace = true
pollster.workspace = true
rodio.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
pollster.workspace = true
rodio.workspace = true
android-activity.workspace = true
ndk = "0.9"
wgpu = { workspace = true, features = ["vulkan"] }

[target.'cfg(windows)'.dependencies]
rfd.workspace = true
wgpu = { workspace = true, features = ["dx12"] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { workspace = true, features = ["xdg-portal", "async-std"] }
wgpu = { workspace = true, features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
rfd.workspace = true
# Note: enable `features = ["metal"]` on `wgpu` when updating Cargo.lock online on macOS.
wgpu.workspace = true

[dev-dependencies]
tempfile.workspace = true
image.workspace = true
