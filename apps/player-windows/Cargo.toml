[package]
name = "player-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nir-engine.workspace = true
anyhow.workspace = true
nir-content.workspace = true
nir-format.workspace = true
serde_json.workspace = true
nir-player.workspace = true
nir-presentation.workspace = true
nir-render-wgpu.workspace = true

[target.'cfg(windows)'.dependencies]
winit = "0.30"
pollster = "0.4"
rodio = { version = "0.21", default-features = false, features = ["playback", "wav"] }
rfd = { version = "0.15", default-features = false }
wgpu = { workspace = true, features = ["dx12"] }

[dev-dependencies]
tempfile = "3"
