<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12292e"><title>NIR · Reader</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10252b;color:#e9eddf;font:16px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:manipulation;outline:none}#shell{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#10252b;z-index:5}#shell[hidden]{display:none}.shell-card{max-width:560px;padding:40px;border-left:2px solid #d4ba7a}h1{font-size:24px;font-weight:500}p{line-height:1.7;white-space:pre-wrap}button{background:#d4ba7a;color:#10252b;border:0;padding:12px 24px;cursor:pointer}.accessible{position:fixed;left:0;top:0;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}#focus-ring{position:fixed;border:2px solid #eedca6;pointer-events:none;display:none;z-index:3}
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="NIR narrative player"></canvas>
<div id="focus-ring" aria-hidden="true"></div>
<nav id="actions" class="accessible" aria-label="Player controls"></nav><p id="announcement" class="accessible" aria-live="polite" aria-atomic="true"></p>
<div id="shell"><div class="shell-card"><small>N I R / WEB READER</small><h1 id="shell-title">正在准备阅读空间</h1><p id="shell-message">Loading the Rust / WebGPU player…</p><button id="reload" hidden>重新加载 / Reload</button></div></div>
<script type="module" src="./bootstrap.js"></script>
</body></html>
