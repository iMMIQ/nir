<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0d1118" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NIR Player</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="safe-area-probe" aria-hidden="true"></div>
  <canvas id="stage" aria-label="Game Stage"></canvas>
  <video id="video-layer" hidden playsinline webkit-playsinline preload="auto"></video>
  <div id="video-overlay" hidden>
    <div class="video-card">
      <button type="button" id="video-play-btn" class="video-btn primary">点击播放影片</button>
      <button type="button" id="video-skip-btn" class="video-btn" hidden>跳过</button>
    </div>
  </div>
  <button type="button" id="shelf-btn" hidden aria-label="Back to Shelf" title="返回书架">← 书架</button>
  <button type="button" id="fs-btn" hidden aria-label="Fullscreen" title="全屏 / 横屏">⛶</button>
  <div id="quick-tools" hidden>
    <button type="button" id="copy-btn" class="tool-pill" title="复制当前台词 (C) · 右键/长按开关自动复制 (Shift+C)">📋</button>
    <button type="button" id="shot-btn" class="tool-pill" title="保存高清无黑边截图 (P)">📷</button>
  </div>
  <div id="sync-pill" hidden aria-live="polite"></div>
  <div id="loader">
    <div class="loader-card">
      <div class="loader-title" id="loader-text">Loading…</div>
      <div class="loader-bar"><div class="loader-fill" id="loader-fill"></div></div>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
