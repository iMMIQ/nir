name: Setup browser audio and Playwright
description: Installs desktop Playwright browsers (optional) and starts a virtual PulseAudio null sink.
inputs:
  install-browsers:
    description: Install Chromium and Firefox via Playwright
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - if: inputs.install-browsers == 'true'
      name: Install desktop browsers and system libraries
      shell: bash
      run: bunx --no-install playwright install --with-deps chromium firefox
    - name: Start virtual audio output
      shell: bash
      run: |
        sudo apt-get install -y pulseaudio
        pulseaudio --start --exit-idle-time=-1
        pactl load-module module-null-sink sink_name=nir_test rate=48000
        pactl set-default-sink nir_test
        pactl info
        pactl list short sinks
