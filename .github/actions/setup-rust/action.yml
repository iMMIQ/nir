name: Setup Rust and Bun toolchain
description: Installs the pinned Rust toolchain, restores Cargo cache, and sets up Bun.
inputs:
  save-cache:
    description: Whether to save the Rust cache
    required: false
    default: 'false'
  with-node:
    description: Whether to also install Node.js
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - if: inputs.with-node == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24.21.0'
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: .bun-version
    - name: Install pinned Rust toolchain
      shell: bash
      run: python scripts/install_toolchain.py
    - name: Restore Rust dependencies, build artifacts and CLI tools
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        save-if: ${{ inputs.save-cache == 'true' }}
