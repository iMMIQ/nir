name: Engine quality
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full pass at 03:17 UTC+8.
    - cron: '17 19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC_x86_64_unknown_linux_gnu: clang
      CXX_x86_64_unknown_linux_gnu: clang++
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang g++ libclang-dev libasound2-dev cmake
      - name: JS syntax check
        run: bun run check:js
      - name: Native and WASM checks
        run: |
          cargo fmt --all --check
          cargo xtask test
          cargo clippy --locked --workspace --all-targets --exclude player-web --exclude player-android -- -D warnings
          cargo clippy --locked -p player-web -p nir-render -p nir-runtime -p nir-ui -p nir-vm -p nir-ir --target wasm32-unknown-unknown -- -D warnings
      - uses: ./.github/actions/build-sdk
      - name: Build and verify example project
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test "$(./dist/novelc --version)" = "novelc $VERSION"
          ./dist/novelc check examples/rain-letters
          ./dist/novelc build examples/rain-letters --target pak --out target/tmp/rain-letters.nirpak
          ./dist/novelc build examples/rain-letters --target web --out dist/rain-letters-web
          ./dist/novelc build examples/rain-letters --target native --out dist/rain-letters-native
          for f in index.html style.css app.js player_web.js player_web_bg.wasm game.nirpak; do
            test -s "dist/rain-letters-web/$f"
          done
          test -x dist/rain-letters-native/player-native
          test -s dist/rain-letters-native/game.nirpak
          rm -rf target/tmp/init-smoke
          ./dist/novelc init target/tmp/init-smoke --title "CI Smoke"
          ./dist/novelc check target/tmp/init-smoke
          ./dist/novelc build target/tmp/init-smoke --target pak --out target/tmp/init-smoke/dist/game.nirpak
          test -s target/tmp/init-smoke/dist/game.nirpak
          ./dist/novelc i18n extract target/tmp/init-smoke --lang en
          test -s target/tmp/init-smoke/locales/en.toml
          python3 scripts/third_party.py target/tmp/NOTICE.txt
          test -s target/tmp/NOTICE.txt
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-test-evidence
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
