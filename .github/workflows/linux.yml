name: Native Linux player
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC_x86_64_unknown_linux_gnu: clang
      CXX_x86_64_unknown_linux_gnu: clang++
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
      - name: Native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang g++ libclang-dev libasound2-dev cmake
      - uses: ./.github/actions/build-sdk
      - name: Package independent sample
        run: |
          rm -rf target/linux-sample
          ./dist/novelc init target/linux-sample --title "Linux Sample"
          ./dist/novelc check target/linux-sample
          ./dist/novelc build target/linux-sample --target native --out target/linux-sample/dist/native
          ./dist/novelc build target/linux-sample --target web --out target/linux-sample/dist/web
          test -x target/linux-sample/dist/native/player-native
          test -s target/linux-sample/dist/native/game.nirpak
          readelf -l target/linux-sample/dist/native/player-native | grep 'Requesting program interpreter: /lib64/ld-linux-x86-64.so.2'
          for f in index.html style.css app.js player_web.js player_web_bg.wasm game.nirpak; do
            test -s "target/linux-sample/dist/web/$f"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-linux-evidence
          path: target/linux-sample/dist/native/
          if-no-files-found: ignore
          retention-days: 7
