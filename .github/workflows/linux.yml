name: Native Linux player
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Native build prerequisites
        run: |
          sudo apt-get update
          # winit dlopens the X11 client libraries at runtime; nothing else on a
          # bare runner pulls them in, so name every dlopen target explicitly.
          sudo apt-get install -y g++ libclang-dev libasound2-dev mesa-vulkan-drivers xvfb \
            libx11-6 libxcursor1 libxi6 libxrandr2 libxrender1 \
            libxkbcommon0 libxkbcommon-x11-0
      # fmt, clippy, and Rust tests run in the Engine quality workflow on the
      # same triggers; this job verifies only the Linux SDK packaging and playback.
      - name: Build SDK
        run: |
          if [ "$("$HOME/.cargo/bin/wasm-bindgen" --version 2>/dev/null || true)" != 'wasm-bindgen 0.2.100' ]; then
            cargo install wasm-bindgen-cli --version 0.2.100 --locked --force
          fi
          cargo xtask sdk
      - name: Start virtual audio output
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=nir_test rate=48000
          pactl set-default-sink nir_test
          pactl info
      - name: Package independent sample
        env:
          # Software Vulkan (lavapipe) keeps the smoke run functional on runners without a GPU.
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          # The restored build cache carries the previous run's sample project;
          # novelc init refuses to overwrite an existing destination.
          rm -rf target/linux-sample
          ./dist/novelc init target/linux-sample
          ./dist/novelc -p target/linux-sample resolve
          ./dist/novelc -p target/linux-sample build --target linux --locked
          ./dist/novelc -p target/linux-sample build --target web --locked
          python3 scripts/verify_release.py target/linux-sample/dist/full/web
          TMPDIR="$PWD/target/tmp" xvfb-run -a -s '-screen 0 1920x1080x24' python3 scripts/verify_linux.py target/linux-sample/dist/full/linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-linux-evidence
          path: |
            reports/linux/
            target/linux-sample/dist/full/linux/
          retention-days: 7
