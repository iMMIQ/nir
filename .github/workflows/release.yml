name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC_x86_64_unknown_linux_gnu: clang
      CXX_x86_64_unknown_linux_gnu: clang++
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          save-cache: 'false'
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang g++ libclang-dev libasound2-dev cmake openjdk-17-jdk-headless
      - name: Locate NDK and build tools
        run: |
          ndk=$(ls -d "$ANDROID_SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ]; then
            echo "E_NDK: no NDK under $ANDROID_SDK_ROOT/ndk; install one (r27c or newer)" >&2
            exit 1
          fi
          if [ ! -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar" ]; then
            (yes || true) | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-35" || true
          fi
          tools="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "ANDROID_NDK_ROOT=$ndk"
            echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$tools/aarch64-linux-android26-clang"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$tools/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS=-C link-arg=-Wl,-z,max-page-size=16384"
            echo "CC_aarch64_linux_android=$tools/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$tools/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$tools/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$tools/llvm-ranlib"
          } >> "$GITHUB_ENV"
          build_tools=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          {
            echo "APKSIGNER=$build_tools/apksigner"
            echo "AAPT2=$build_tools/aapt2"
            echo "NIR_APK_APKSIGNER=$build_tools/apksigner"
            echo "NIR_APK_AAPT2=$build_tools/aapt2"
          } >> "$GITHUB_ENV"
      - name: JS syntax check
        run: bun run check:js
      - name: Native and WASM checks
        run: |
          cargo fmt --all --check
          cargo xtask test
          cargo clippy --locked --workspace --all-targets --exclude player-web --exclude player-android -- -D warnings
          cargo clippy --locked -p player-web -p nir-render -p nir-runtime -p nir-ui -p nir-vm -p nir-ir --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --locked -p player-native -p player-android --target aarch64-linux-android --all-targets -- -D warnings
      - uses: ./.github/actions/build-sdk
      - name: Build and verify example project
        run: |
          ./dist/novelc check examples/rain-letters
          ./dist/novelc build examples/rain-letters --target web --out dist/rain-letters-web
          ./dist/novelc build examples/rain-letters --target native --out dist/rain-letters-linux
          ./dist/novelc build examples/rain-letters --target android --out dist/rain-letters-android/Game.apk
          "$AAPT2" dump badging dist/rain-letters-android/Game.apk
          "$APKSIGNER" verify --verbose dist/rain-letters-android/Game.apk
      - name: Package and verify release assets
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$VERSION"; fi
          test "$(dist/novelc --version)" = "novelc $VERSION"
          test -x dist/sdk/native/player-native
          test -f dist/sdk/android/lib/arm64-v8a/libplayer.so
          LC_ALL=C readelf -lW dist/sdk/android/lib/arm64-v8a/libplayer.so | grep -E 'LOAD.*0x4000'
          python3 scripts/package.py
          (cd dist && sha256sum --check SHA256SUMS)
          readelf -l dist/bundle/novelc | grep 'Requesting program interpreter: /lib64/ld-linux-x86-64.so.2'
          readelf -l dist/bundle/sdk/native/player-native | grep 'Requesting program interpreter: /lib64/ld-linux-x86-64.so.2'
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          TAG="v$VERSION"
          cp dist/rain-letters-android/Game.apk "dist/rain-letters-$VERSION-android-arm64.apk"
          (cd dist && sha256sum "rain-letters-$VERSION-android-arm64.apk" >> SHA256SUMS)
          gh release create "$TAG" --target "$GITHUB_SHA" --title "NIR $TAG · 叙事引擎与 SDK" --notes-file "docs/releases/$TAG.md" "dist/nir-$VERSION-linux-x86_64.tar.gz" "dist/nir-$VERSION-source.tar.gz" "dist/rain-letters-$VERSION-android-arm64.apk" dist/SHA256SUMS
      - name: Retain SDK on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failed-release-sdk
          path: |
            dist/novelc
            dist/sdk/
          if-no-files-found: ignore
          retention-days: 3
      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: |
            reports/
            dist/SHA256SUMS
          if-no-files-found: ignore
          retention-days: 14
