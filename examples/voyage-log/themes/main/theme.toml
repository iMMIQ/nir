[[image_menus.system.elements]]
id = "older"
parent = "page-history"
rect = [60.0, 260.0, 300.0, 56.0]
content = { type = "button", label = "更早", asset = "ui.older", action = { type = "history_page", window = "records", delta = 1 } }

[[image_menus.system.elements]]
id = "newer"
