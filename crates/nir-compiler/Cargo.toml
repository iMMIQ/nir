[package]
name = "nir-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nir-format = { workspace = true, features = ["schema"] }
nir-core.workspace = true
nir-content.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
anyhow.workspace = true
image.workspace = true
flate2.workspace = true
unicode-normalization = "=0.1.25"
ttf-parser = "0.25"
hb-subset = { version = "=0.3.0", features = ["bundled"] }
tempfile = "3"
schemars.workspace = true

[dev-dependencies]
rustybuzz = "0.14"
