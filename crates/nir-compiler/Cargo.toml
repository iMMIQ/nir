[package]
name = "nir-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nir-format = { workspace = true, features = ["schema"] }
nir-core.workspace = true
nir-content.workspace = true
nir-apk.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
image.workspace = true
flate2.workspace = true
unicode-normalization = "=0.1.25"
ttf-parser = "0.25"
hb-subset = { version = "=0.3.0", features = ["bundled"] }
tempfile.workspace = true
schemars.workspace = true
webp = "0.3"
mp3lame-encoder = "0.2"
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3"] }

[dev-dependencies]
rustybuzz = "0.14"
nir-player.workspace = true
nir-presentation.workspace = true
